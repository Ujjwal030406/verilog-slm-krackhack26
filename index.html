<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sovereign AI Verilog Generator</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link
        href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=JetBrains+Mono:wght@400;700&display=swap"
        rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        cyber: {
                            black: '#050505',
                            dark: '#0a0a0a',
                            panel: '#111111',
                            neonBlue: '#00f3ff',
                            neonGreen: '#0aff00',
                            neonPink: '#ff00ff',
                            text: '#e0e0e0',
                            dim: '#888888'
                        }
                    },
                    fontFamily: {
                        display: ['Orbitron', 'sans-serif'],
                        mono: ['JetBrains Mono', 'monospace'],
                    },
                    boxShadow: {
                        'neon-blue': '0 0 5px #00f3ff, 0 0 10px #00f3ff44',
                        'neon-green': '0 0 5px #0aff00, 0 0 10px #0aff0044',
                    }
                }
            }
        }
    </script>
    <style>
        body {
            background-color: #050505;
            color: #e0e0e0;
            font-family: 'JetBrains Mono', monospace;
            background-image:
                linear-gradient(rgba(0, 243, 255, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 243, 255, 0.03) 1px, transparent 1px);
            background-size: 30px 30px;
        }

        /* Custom scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }

        ::-webkit-scrollbar-track {
            background: #0a0a0a;
        }

        ::-webkit-scrollbar-thumb {
            background: #333;
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #00f3ff;
        }

        .glitch-effect {
            position: relative;
        }

        .code-window {
            background: #0a0a0a;
            border: 1px solid #333;
            box-shadow: 0 0 15px rgba(0, 0, 0, 0.5);
        }

        .loading-spinner {
            border: 3px solid rgba(0, 243, 255, 0.1);
            border-left-color: #00f3ff;
            border-radius: 50%;
            width: 24px;
            height: 24px;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }
    </style>
</head>

<body class="h-screen flex flex-col overflow-hidden">

    <!-- Header -->
    <header
        class="border-b border-gray-800 bg-cyber-dark/90 backdrop-blur-sm p-4 flex justify-between items-center shadow-lg z-10 relative">
        <div class="flex items-center gap-3">
            <h1
                class="text-2xl md:text-3xl font-display font-bold text-transparent bg-clip-text bg-gradient-to-r from-cyber-neonBlue to-cyber-neonGreen tracking-wider drop-shadow-[0_0_2px_rgba(0,243,255,0.5)]">
                ⚡ Verilog Sovereign SLM
            </h1>
        </div>

        <div class="flex items-center gap-4">
            <div
                class="hidden md:flex items-center gap-2 px-3 py-1 rounded-full border border-cyber-neonGreen/30 bg-cyber-neonGreen/5 text-xs text-cyber-neonGreen font-mono shadow-[0_0_10px_rgba(10,255,0,0.1)]">
                <span class="w-2 h-2 rounded-full bg-cyber-neonGreen animate-pulse"></span>
                RUNNING LOCALLY
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="flex-1 flex flex-col md:flex-row p-4 gap-4 overflow-hidden relative">

        <!-- Grid Background Decor -->
        <div
            class="absolute top-0 right-0 w-1/3 h-full bg-gradient-to-l from-cyber-neonBlue/5 to-transparent pointer-events-none">
        </div>

        <!-- Left Column: Input -->
        <section class="flex-1 flex flex-col gap-4 min-h-0 z-10">
            <div class="bg-cyber-panel border border-gray-800 rounded-lg p-1 flex items-center justify-between">
                <span class="text-xs text-cyber-dim px-3 font-mono">PROMPT_INPUT_BUFFER</span>
                <div class="flex gap-1 px-2">
                    <div class="w-2 h-2 rounded-full bg-red-500/50"></div>
                    <div class="w-2 h-2 rounded-full bg-yellow-500/50"></div>
                    <div class="w-2 h-2 rounded-full bg-green-500/50"></div>
                </div>
            </div>

            <textarea id="promptInput"
                class="flex-1 w-full bg-black/50 border border-gray-700 rounded-lg p-5 text-cyber-text font-mono text-lg focus:outline-none focus:border-cyber-neonBlue focus:shadow-neon-blue transition-all resize-none placeholder-gray-700"
                placeholder="// Enter your Verilog module description here...
// Example: Write a 4-bit synchronous up/down counter with reset."></textarea>

            <button id="generateBtn" onclick="generateVerilog()"
                class="group relative w-full py-4 bg-cyber-dark border border-cyber-neonBlue text-cyber-neonBlue font-display font-bold text-xl tracking-widest hover:bg-cyber-neonBlue hover:text-black transition-all duration-300 overflow-hidden rounded-lg shadow-[0_0_15px_rgba(0,243,255,0.2)] hover:shadow-[0_0_25px_rgba(0,243,255,0.6)] active:scale-[0.99]">
                <span class="relative z-10 flex items-center justify-center gap-3">
                    <span id="btnText">INITIATE GENERATION_SEQUENCE</span>
                    <span id="btnSpinner" class="loading-spinner hidden"></span>
                </span>
                <div
                    class="absolute inset-0 bg-cyber-neonBlue/20 transform translate-y-full group-hover:translate-y-0 transition-transform duration-300">
                </div>
            </button>
        </section>

        <!-- Right Column: Output -->
        <section class="flex-1 flex flex-col min-h-0 z-10">
            <!-- Terminal Header -->
            <div
                class="bg-cyber-dark border-t border-l border-r border-gray-700 rounded-t-lg p-2 flex items-center justify-between">
                <div class="flex items-center gap-2">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 text-cyber-dim" fill="none"
                        viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 9l3 3-3 3m5 0h3" />
                    </svg>
                    <span class="text-xs text-cyber-neonBlue font-mono">OUTPUT_STREAM.v</span>
                </div>
                <button onclick="copyCode()"
                    class="text-xs flex items-center gap-1 text-cyber-dim hover:text-white transition-colors px-2 py-1 rounded hover:bg-white/10"
                    title="Copy to Clipboard">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-3 w-3" fill="none" viewBox="0 0 24 24"
                        stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M8 7v8a2 2 0 002 2h6M8 7V5a2 2 0 012-2h4.586a1 1 0 01.707.293l4.414 4.414a1 1 0 01.293.707V15a2 2 0 01-2 2h-2M8 7H6a2 2 0 00-2 2v10a2 2 0 002 2h8a2 2 0 002-2v-2" />
                    </svg>
                    COPY
                </button>
            </div>

            <!-- Terminal Body -->
            <div
                class="flex-1 bg-[#050505] border border-gray-700 rounded-b-lg p-0 relative overflow-hidden flex flex-col">
                <!-- Scanline effect -->
                <div
                    class="absolute inset-0 bg-gradient-to-b from-transparent via-white/5 to-transparent opacity-10 pointer-events-none animate-scan">
                </div>

                <pre class="flex-1 p-4 overflow-auto text-sm md:text-base leading-relaxed"><code id="codeOutput" class="language-verilog text-gray-400 block pb-10">// Waiting for input signal...
// System ready.
</code></pre>

                <div
                    class="absolute bottom-0 left-0 right-0 h-6 bg-cyber-dark/80 backdrop-blur border-t border-gray-800 flex items-center px-2">
                    <span class="text-[10px] text-cyber-dim font-mono">Ln 1, Col 1</span>
                    <span class="flex-1"></span>
                    <span class="text-[10px] text-cyber-neonGreen font-mono">VERILOG-MODE</span>
                </div>
            </div>
        </section>
    </main>

    <footer class="text-center p-2 text-[10px] text-cyber-dim border-t border-gray-900 bg-black">
        SYSTEM STATUS: ONLINE | v1.0.0
    </footer>

    <script>
        async function generateVerilog() {
            const prompt = document.getElementById('promptInput').value;
            const outputElement = document.getElementById('codeOutput');
            const btnText = document.getElementById('btnText');
            const btnSpinner = document.getElementById('btnSpinner');
            const generateBtn = document.getElementById('generateBtn');

            if (!prompt.trim()) {
                alert('Please enter a prompt first.');
                return;
            }

            // UI Loading State
            btnText.innerText = 'PROCESSING...';
            btnSpinner.classList.remove('hidden');
            generateBtn.disabled = true;
            generateBtn.classList.add('opacity-75', 'cursor-not-allowed');
            outputElement.innerHTML = '<span class="animate-pulse text-cyber-neonBlue">Initializing Synthesis Engine...\nConnecting to Neural Link...</span>';

            try {
                const response = await fetch('/generate', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ prompt: prompt })
                });

                if (!response.ok) {
                    throw new Error(`Server returned ${response.status} ${response.statusText}`);
                }

                const data = await response.json();

                // Simulate typing effect or just dump code? Let's dump for now but style it.
                // Assuming data.code or similar key, adjust based on actual API.
                // If API returns raw text, use that.
                const code = data.code || data.generated_text || JSON.stringify(data, null, 2);

                outputElement.innerText = code;
                outputElement.classList.remove('text-gray-400');
                outputElement.classList.add('text-cyber-neonGreen');

            } catch (error) {
                console.error('Error:', error);
                outputElement.innerHTML = `<span class="text-red-500">ERROR: Connection Failed.\n${error.message}\n\nEnsure local backend is running at port 5000.</span>`;
            } finally {
                // Reset UI
                btnText.innerText = 'INITIATE GENERATION_SEQUENCE';
                btnSpinner.classList.add('hidden');
                generateBtn.disabled = false;
                generateBtn.classList.remove('opacity-75', 'cursor-not-allowed');
            }
        }

        function copyCode() {
            const code = document.getElementById('codeOutput').innerText;
            navigator.clipboard.writeText(code).then(() => {
                const originalText = document.querySelector('button[onclick="copyCode()"]').innerHTML;
                const btn = document.querySelector('button[onclick="copyCode()"]');

                btn.innerHTML = `<span class="text-cyber-neonGreen">COPIED!</span>`;
                setTimeout(() => {
                    btn.innerHTML = originalText;
                }, 2000);
            }).catch(err => {
                console.error('Failed to copy text: ', err);
            });
        }
    </script>
</body>

</html>
